  <!-- Mannequin Head Form (Pure Faceless) -->
  <ellipse cx="60" cy="46" rx="16" ry="21" fill="url(#n-torso)" />
  <!-- Atelier Crown Cap -->
  <ellipse cx="60" cy="27" rx="8" ry="3.5" fill="#71717A" />
  <circle cx="60" cy="24" r="2.5" fill="#A1A1AA" />
