<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TailorBird — Luxury Digital Wardrobe & Personal Styling</title>
    <meta name="description" content="TailorBird — Clean, Minimalist Digital Wardrobe & Fashion Network." />
    <!-- Instant synchronous theme script to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var preference = localStorage.getItem('stylesphere_theme_preference') || 'system';
          var isDark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FBFBFB] dark:bg-[#121214] text-[#18181B] dark:text-[#F4F4F5] font-sans antialiased selection:bg-neutral-200 dark:selection:bg-neutral-800 min-h-screen transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
