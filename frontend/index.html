<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TailorBird — AI Wardrobe & Personal Stylist</title>
    <meta name="description" content="TailorBird — Editorial AI Digital Wardrobe & Intelligent Personal Fashion Stylist." />
    <!-- Google Fonts: Playfair Display (Editorial Serif), Plus Jakarta Sans (Clean Modern Body), JetBrains Mono (Metrics) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Instant synchronous theme script to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var preference = localStorage.getItem('stylesphere_theme_preference') || 'system';
          var isDark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FBFBFB] dark:bg-[#121214] text-[#18181B] dark:text-[#F4F4F5] font-sans antialiased selection:bg-neutral-200 dark:selection:bg-neutral-800 min-h-screen transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
